name: Daily Rewards

on:
  schedule:
    - cron: '5 0 * * *'  # 00:05 UTC every day
  workflow_dispatch:

jobs:
  daily-rewards:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check secret (hypothesis F)
        run: |
          echo "CRON_SECRET length: ${#CRON_SECRET}"
          if [ -z "$CRON_SECRET" ]; then
            echo "ERROR: CRON_SECRET is empty - secret not configured in GitHub"
          fi

      - name: Trigger daily rewards cron
        run: |
          set -euo pipefail
          body=$(mktemp)
          redirect_log=$(mktemp)
          # hypothesis G: capture redirects with -v, use env var for secret
          code=$(curl -s -o "$body" -w "%{http_code}" --max-redirs 0 \
            -X GET https://www.lemonroad.xyz/api/cron/daily-rewards \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP $code"
          cat "$body"
          if [ "$code" -ge 400 ]; then
            echo "cron failed"
            exit 22
          fi
