name: Daily Rewards

on:
  schedule:
    - cron: '5 18 * * *'  # 21:05 GMT+3 every day (18:05 UTC)
  workflow_dispatch:

jobs:
  daily-rewards:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily rewards cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          body=$(mktemp)
          code=$(curl -s -o "$body" -w "%{http_code}" \
            -X GET https://www.lemonroad.xyz/api/cron/daily-rewards \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP $code"
          cat "$body"
          if [ "$code" -ge 400 ]; then
            echo "cron failed"
            exit 22
          fi
