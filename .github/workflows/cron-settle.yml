name: Settle Hour Cron

# Hourly schedule disabled for now — enable when ready:
# schedule:
#   - cron: '5 * * * *'
on:
  workflow_dispatch:

jobs:
  settle:
    name: Settle previous hour
    runs-on: ubuntu-latest
    steps:
      - name: Call settle-hour endpoint
        run: |
          curl --fail -X GET https://www.lemonroad.xyz/api/cron/settle-hour \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
