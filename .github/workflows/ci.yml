name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check frontend
        run: node_modules/.bin/tsc --project tsconfig.json --noEmit

      - name: Type-check API
        run: node_modules/.bin/tsc --project tsconfig.api.json --noEmit

      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://lemon:lemon@localhost/lemon?sslmode=disable' }}

  migrate:
    name: Run DB migrations
    runs-on: ubuntu-latest
    # Only run on pushes to main, not on PRs, and only if DATABASE_URL is configured
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RUN_MIGRATIONS == 'true'
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
