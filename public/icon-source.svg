<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Yellow background -->
  <rect width="512" height="512" fill="#fff200"/>

  <!-- Road stripes at bottom (readable even at 32x32) -->
  <rect x="0" y="400" width="512" height="112" fill="#444"/>
  <rect x="196" y="420" width="40" height="30" fill="#fff200" rx="4"/>
  <rect x="276" y="420" width="40" height="30" fill="#fff200" rx="4"/>
  <rect x="196" y="460" width="40" height="30" fill="#fff200" rx="4"/>
  <rect x="276" y="460" width="40" height="30" fill="#fff200" rx="4"/>

  <!-- Lemon body -->
  <ellipse cx="256" cy="210" rx="148" ry="172" fill="#fff200" stroke="#000" stroke-width="18"/>

  <!-- Lemon shading bump (left side) -->
  <ellipse cx="196" cy="175" rx="34" ry="52" fill="#e6c200" opacity="0.7"/>

  <!-- Eyes -->
  <circle cx="210" cy="180" r="22" fill="#000"/>
  <circle cx="302" cy="180" r="22" fill="#000"/>
  <!-- Eye shine -->
  <circle cx="218" cy="172" r="7" fill="#fff"/>
  <circle cx="310" cy="172" r="7" fill="#fff"/>

  <!-- Smile -->
  <path d="M194 260 Q256 320 318 260" fill="none" stroke="#000" stroke-width="14" stroke-linecap="round"/>

  <!-- Green leaf on top -->
  <ellipse cx="256" cy="42" rx="40" ry="70" fill="#228B22" stroke="#000" stroke-width="12" transform="rotate(-15 256 42)"/>
  <ellipse cx="286" cy="38" rx="30" ry="55" fill="#228B22" stroke="#000" stroke-width="10" transform="rotate(15 286 38)"/>

  <!-- Leaf vein -->
  <line x1="256" y1="10" x2="256" y2="80" stroke="#000" stroke-width="4" stroke-linecap="round"/>
</svg>
